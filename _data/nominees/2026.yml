  judged_by: ''
  reason_for: |-
    コミュニティの継続のために長年貢献してきたため、RubyKajaとして推薦します。

    コロナ禍以前からKyoto.rbに参加し続けているだけでなく、オンラインプログラミング教室の新規メンバーを誘う、自ら発表するなど、コミュニティ継続のためのさまざまな活動を目立たないながらも継続してきました。

    コロナ禍で参加人数が激減した後も活動を通じてコミュニティに貢献し、参加メンバーが困っている場面で参考情報を共有したり、自身の困りごとや直面していることを率先して自己開示したりすることで、開かれた議論の場づくりにも貢献しています。
