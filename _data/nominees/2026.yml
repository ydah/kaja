  reason_for: |-
    コロナ禍で出雲のエンジニアコミュニティが途絶え、地元エンジニアが社外のエンジニアと交流する機会を失っていた中で、Izumo Developers' Guildを立ち上げ、出雲にRubyコミュニティの礎を築いたため。

    2024年9月に出雲のIT企業へ呼びかけてコミュニティを立ち上げ、月次のエンジニア勉強会を企画しました。Rails Girls Izumo 1stの開催支援や出雲Ruby会議01の企画者として、出雲に存在していなかったRubyコミュニティを創設し、エンジニアの交流の場を作っています。

    出雲Ruby会議01では地元エンジニアの登壇枠を設けるなど、地元で活動するエンジニアにスポットを当てる取り組みも続けています。
