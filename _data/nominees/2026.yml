  description: "Izumo Developers' Guildは、主に出雲で活動しているRuby大好き、その他技術が好きなエンジニアが集まるコミュニティです。ミートアップでは電子工作をしてみたり、参加者の人と相談したりしています。次回の開催内容などはSlackで話していて、興味がある方はどなたでも参加可能です。"
